name: Sitemap Otomatik Güncelle

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
  workflow_dispatch:

jobs:
  sitemap-guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Slug'ları çek ve sitemap.xml oluştur
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          # index.html'den tüm slug'ları çek
          SLUGS=$(grep -o 'slug: "[^"]*"' index.html | sed 's/slug: "//;s/"//')
          SORU_SAYISI=$(echo "$SLUGS" | wc -l)

          echo "📊 Toplam $SORU_SAYISI soru bulundu."

          # sitemap.xml başlangıcı
          cat > sitemap.xml << XMLSTART
<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">

  <!-- Ana sayfa -->
  <url>
    <loc>https://hakbul.com.tr/</loc>
    <lastmod>${TODAY}</lastmod>
    <changefreq>daily</changefreq>
    <priority>1.0</priority>
  </url>

  <!-- Kategori sayfaları -->
  <url>
    <loc>https://hakbul.com.tr/index.html#/sorular</loc>
    <lastmod>${TODAY}</lastmod>
    <changefreq>daily</changefreq>
    <priority>0.9</priority>
  </url>
  <url>
    <loc>https://hakbul.com.tr/index.html#/sorular/memur</loc>
    <lastmod>${TODAY}</lastmod>
    <changefreq>weekly</changefreq>
    <priority>0.8</priority>
  </url>
  <url>
    <loc>https://hakbul.com.tr/index.html#/sorular/guvenlik</loc>
    <lastmod>${TODAY}</lastmod>
    <changefreq>weekly</changefreq>
    <priority>0.8</priority>
  </url>
  <url>
    <loc>https://hakbul.com.tr/index.html#/sorular/is-guvenligi</loc>
    <lastmod>${TODAY}</lastmod>
    <changefreq>weekly</changefreq>
    <priority>0.8</priority>
  </url>
  <url>
    <loc>https://hakbul.com.tr/index.html#/sorular/isci-haklari</loc>
    <lastmod>${TODAY}</lastmod>
    <changefreq>weekly</changefreq>
    <priority>0.8</priority>
  </url>

XMLSTART

          # Her slug için soru.html?slug= URL'si ekle
          while IFS= read -r slug; do
            cat >> sitemap.xml << URLBLOCK
  <url>
    <loc>https://hakbul.com.tr/soru.html?slug=${slug}</loc>
    <lastmod>${TODAY}</lastmod>
    <changefreq>monthly</changefreq>
    <priority>0.7</priority>
  </url>

URLBLOCK
          done <<< "$SLUGS"

          # Kapanış
          echo "</urlset>" >> sitemap.xml

          echo "✅ sitemap.xml güncellendi — $SORU_SAYISI soru URL'si eklendi."

      - name: Commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "🗺️ sitemap.xml otomatik güncellendi — $(date -u +"%Y-%m-%d")"
          git push
